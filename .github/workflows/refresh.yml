name: Refresh matchup data and publish

on:
  schedule:
    # Runs at 8am and 4pm UTC daily (roughly 4am/noon US Eastern).
    # Adjust anytime by editing these two lines -- no other setup needed.
    - cron: "0 8,16 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest data
        run: python build_data.py

      - name: Render v0 page
        run: python render_html.py

      - name: Verify build before publishing
        run: python check_build.py

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
