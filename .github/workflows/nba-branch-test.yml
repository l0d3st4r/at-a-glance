name: NBA branch test build

# TEMPORARY (2026-10-08): runs the NBA build from this branch on a GitHub runner, where ESPN's
# scoreboard is reachable, to check the preseason and live-score paths before the PR. Publishes
# nothing; deleted before merging.

on:
  push:
    branches: [claude/fervent-wright-l9vbqu]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Update check (fingerprint incl. NBA)
        run: python check_updates.py --out stamps.json
      - name: Pull NBA data
        run: python build_nba_data.py
      - name: Render NBA pages
        run: python render_nba.py
      - name: Verify the NBA section
        run: python check_build.py --nba
      - name: What the build saw
        run: |
          du -sh site/nba
          python - <<'PY'
          import json
          d = json.load(open("data/nba.json"))
          print("current day:", d["current_day_key"], "| days:", len(d["days"]), "| games:", len(d["game_details"]))
          pre = [g for x in d["days"] for g in x["games"] if g["game_type"] == "PRE"]
          print("preseason games:", len(pre), "| finished:", sum(g["final"] for g in pre), "| live:", sum(g["live"] for g in pre))
          for x in d["days"]:
              if x["key"] == d["current_day_key"]:
                  for g in x["games"]:
                      print(" ", g["away"]["team"], g["away"]["score"], "@", g["home"]["team"], g["home"]["score"], g["status_detail"], g["networks"], g["note"])
          print("warnings:", *d["warnings"], sep="\n  ")
          PY
